name: Release Plugins

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'registry.json'
      - '.github/workflows/release-plugins.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-plugins
  cancel-in-progress: false

jobs:
  compiler-packages:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-latest
            platform: win32-x64
          - os: windows-11-arm
            platform: win32-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package compiler for this platform
        shell: pwsh
        run: |
          $actualPlatform = & node -p "process.platform + '-' + process.arch"
          if ($actualPlatform -ne '${{ matrix.platform }}') { throw "Runner platform mismatch: $actualPlatform" }
          $version = (Get-Content plugins/ui-compiler-vue/plugin.json -Raw | ConvertFrom-Json).version
          pwsh -NoProfile -File scripts/package-plugin.ps1 -PluginId ui-compiler-vue
          Move-Item "dist/ui-compiler-vue-$version.zip" "dist/ui-compiler-vue-$version-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: compiler-${{ matrix.platform }}
          path: dist/ui-compiler-vue-*.zip

  release:
    needs: compiler-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run plugin tests
        run: |
          npm ci
          npm ci --prefix plugins/office --ignore-scripts --no-audit --no-fund
          npm ci --prefix plugins/ui-compiler-vue --ignore-scripts --no-audit --no-fund
          npm test

      - uses: actions/download-artifact@v4
        with:
          pattern: compiler-*
          path: dist
          merge-multiple: true

      - name: Detect changes, package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: wdsj2066/artificer-plugins
        run: |
          set -euo pipefail
          mkdir -p dist
          published=0

          compiler_version=$(jq -r .version plugins/ui-compiler-vue/plugin.json)
          compiler_tag="ui-compiler-vue-v$compiler_version"
          compiler_changed=true
          if git rev-parse -q --verify "refs/tags/$compiler_tag" >/dev/null 2>&1; then
            if git diff --quiet "$compiler_tag..HEAD" -- plugins/ui-compiler-vue scripts/package-plugin.ps1 scripts/build-plugin-ui.mjs; then
              compiler_changed=false
            fi
          fi
          if [ "$compiler_changed" = "true" ]; then
            compiler_zips=(dist/ui-compiler-vue-"$compiler_version"-*.zip)
            compiler_notes="## ui-compiler-vue v$compiler_version"
            for zip in "${compiler_zips[@]}"; do
              compiler_notes="$compiler_notes"$'\n'"- $(basename "$zip"): $(sha256sum "$zip" | cut -d' ' -f1)"
            done
            if gh release view "$compiler_tag" >/dev/null 2>&1; then
              gh release upload "$compiler_tag" "${compiler_zips[@]}" --clobber
              gh release edit "$compiler_tag" --title "ui-compiler-vue v$compiler_version" --notes "$compiler_notes"
            else
              gh release create "$compiler_tag" "${compiler_zips[@]}" --title "ui-compiler-vue v$compiler_version" --notes "$compiler_notes"
            fi
            published=1
          fi
          echo "compiler_published=$compiler_changed" >> "$GITHUB_ENV"

          for id in browser-automation channel-feishu channel-wecom token-usage office plugin-builder; do
            version=$(jq -r .version "plugins/$id/plugin.json")
            tag="$id-v$version"
            zip="dist/$id-$version.zip"

            changed=true
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null 2>&1; then
              if git diff --quiet "$tag..HEAD" -- "plugins/$id" "scripts/package-plugin.ps1" "scripts/build-plugin-ui.mjs" "plugins/ui-compiler-vue/server.js"; then
                changed=false
              fi
            fi

            if [ "$changed" = "false" ]; then
              echo "::notice::$id unchanged since $tag, skipping"
              continue
            fi

            echo "Packaging $id v$version"
            pwsh -NoProfile -File scripts/package-plugin.ps1 -PluginId "$id" -OutputDir dist

            sha=$(sha256sum "$zip" | cut -d' ' -f1)
            echo "${id}_sha=$sha" >> "$GITHUB_ENV"

            notes="## $id v$version"
            notes="$notes"$'\n\n'"- File: \`$id-$version.zip\`"
            notes="$notes"$'\n'"- SHA-256: \`$sha\`"

            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$zip" --clobber
              gh release edit "$tag" --title "$id v$version" --notes "$notes"
            else
              gh release create "$tag" "$zip" --title "$id v$version" --notes "$notes"
            fi
            published=1
          done

          echo "published=$published" >> "$GITHUB_ENV"

      - name: Regenerate registry.json
        if: env.published == '1'
        run: |
          node <<'EOF'
          const fs = require('fs');
          const crypto = require('crypto');
          const ids = ['ui-compiler-vue', 'browser-automation', 'channel-feishu', 'channel-wecom', 'token-usage', 'office', 'plugin-builder'];
          const previous = JSON.parse(fs.readFileSync('registry.json', 'utf8')).plugins;
          const plugins = ids.map((id) => {
            const manifest = JSON.parse(fs.readFileSync(`plugins/${id}/plugin.json`, 'utf8'));
            const version = manifest.version;
            const tag = `${id}-v${version}`;
            const old = previous.find(plugin => plugin.id === id) || {};
            const plugin = {
              id,
              name: manifest.name,
              description: manifest.description,
              version,
              author: manifest.author,
              hasBackend: fs.existsSync(`plugins/${id}/server.js`),
              permissions: manifest.permissions || [],
              repositoryUrl: `https://github.com/wdsj2066/artificer-plugins/tree/main/plugins/${id}`,
              downloadUrl: `https://github.com/wdsj2066/artificer-plugins/releases/download/${tag}/${id}-${version}.zip`,
              sha256: process.env[`${id}_sha`] || old.sha256 || null
            };
            if (id === 'ui-compiler-vue') {
              const platforms = ['linux-x64', 'linux-arm64', 'win32-x64', 'win32-arm64', 'darwin-x64', 'darwin-arm64'];
              plugin.downloads = Object.fromEntries(platforms.map(platform => {
                const filename = `${id}-${version}-${platform}.zip`;
                const zip = `dist/${filename}`;
                return [platform, {
                  downloadUrl: `https://github.com/wdsj2066/artificer-plugins/releases/download/${tag}/${filename}`,
                  sha256: process.env.compiler_published === 'true' && fs.existsSync(zip)
                    ? crypto.createHash('sha256').update(fs.readFileSync(zip)).digest('hex')
                    : old.downloads?.[platform]?.sha256 || null
                }];
              }));
              delete plugin.downloadUrl;
              delete plugin.sha256;
            }
            return plugin;
          });
          fs.writeFileSync('registry.json', JSON.stringify({ plugins }, null, 2) + '\n');
          EOF

      - name: Commit registry.json
        if: env.published == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          if git diff --cached --quiet; then
            echo "registry.json unchanged"
          else
            git commit -m "chore(市场): 同步插件索引 [skip ci]"
            git push
          fi
